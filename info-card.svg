<svg xmlns="http://www.w3.org/2000/svg" width="490" height="380">
  <style>
    .win  { fill: transparent; stroke: #30363d; stroke-width: 1; rx: 8; }
    .txt  { font-family: 'Consolas','Monaco',monospace; font-size: 12.5px; fill: #e6edf3; }
    .kn   { fill: #79c0ff; font-weight: bold; }
    .ks   { fill: #d2a8ff; font-weight: bold; }
    .kh   { fill: #ffa657; font-weight: bold; text-decoration: underline; }
    .hi   { fill: #7ee787; }
    .ttl  { fill: #58a6ff; font-weight: bold; }
    .sep  { fill: #30363d; }
    .line { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .d1  { animation-delay: .08s; }
    .d2  { animation-delay: .16s; }
    .d3  { animation-delay: .24s; }
    .d4  { animation-delay: .32s; }
    .d5  { animation-delay: .40s; }
    .d6  { animation-delay: .48s; }
    .d7  { animation-delay: .56s; }
    .d8  { animation-delay: .64s; }
    .d9  { animation-delay: .72s; }
    .d10 { animation-delay: .80s; }
    .d11 { animation-delay: .88s; }
    .d12 { animation-delay: .96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
  </style>

  <rect width="488" height="378" x="1" y="1" class="win"/>

